name: גבולות עירוב — Release

# יוצר GitHub Release לכל גרסה חדשה (לפי version ב-manifest), עם קובץ ה-.otzplugin ותיאור מתוך README.
# האריזה נעשית כאן ב-CI (החבילה כ-70MB, ולכן היא לא נשמרת ב-git).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack
        run: |
          v="$(node -p "require('./gvulot-eruv/manifest.json').version")"
          python3 gvulot-eruv-build/pack.py gvulot-eruv "gvulot-eruv-$v.otzplugin"
          ls -la "gvulot-eruv-$v.otzplugin"
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="$(node -p "require('./gvulot-eruv/manifest.json').version")"
          tag="gvulot-eruv-v$v"; file="gvulot-eruv-$v.otzplugin"
          if gh release view "$tag" >/dev/null 2>&1; then echo "Release $tag כבר קיים"; exit 0; fi
          awk -v h="## מה חדש ב-$v" 'index($0,h)==1{f=1;next} /^## /{if(f)exit} f' README.md > notes.md
          printf '\n### התקנה\nבאוצריא: כלים ← תוספים ← התקן תוסף חדש, ובחירת הקובץ.\n' >> notes.md
          gh release create "$tag" "$file" --target "$GITHUB_SHA" --title "גבולות עירוב $v" --notes-file notes.md --prerelease

  # פרסום לחנות התוספים של אוצריא (נדרשים הסודות OTZARIA_USER ו-OTZARIA_PASSWORD).
  store:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Otzaria/otzaria-plugin-validator@v1
        with:
          path: gvulot-eruv
          otzaria-user: ${{ secrets.OTZARIA_USER }}
          otzaria-password: ${{ secrets.OTZARIA_PASSWORD }}
