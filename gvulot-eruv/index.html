<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>גבולות עירוב</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="shared/promo/achat-promo.css">
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="topbar-brand">
      <svg class="topbar-logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18 L8 6 L12 15 L16 5 L20 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="8" cy="6" r="1.6" fill="currentColor"/><circle cx="16" cy="5" r="1.6" fill="currentColor"/></svg>
      <div class="topbar-titles">
        <h1 class="topbar-title">גבולות עירוב</h1>
        <span class="topbar-sub" id="crumb">כל הארץ</span>
      </div>
    </div>
    <label class="topbar-search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15 15l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="q" type="search" autocomplete="off" placeholder="עיר, שכונה, רחוב או שם האחראי" aria-label="חיפוש" autofocus>
      <kbd class="topbar-kbd">/</kbd>
    </label>
    <div class="topbar-actions">
      <button class="icon-btn topbar-btn lang-btn" id="btnLang" title="English" aria-label="English / עברית">EN</button>
      <button class="icon-btn topbar-btn" id="btnHome" title="כל הערים" aria-label="כל הערים"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lbl">ערים</span></button>
      <button class="icon-btn topbar-btn" id="btnLoc" title="המיקום שלי — פתיחת העיר הקרובה" aria-label="המיקום שלי"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-5.8-6.5-11a6.5 6.5 0 0 1 13 0c0 5.2-6.5 11-6.5 11z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lbl">מיקום</span></button>
      <button class="icon-btn topbar-btn" id="btnDocs" title="תחום שבת, חוברות וספרייה" aria-label="תחום שבת וחוברות"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h7l4 4V19a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 6 19V5a1.5 1.5 0 0 1 1-1.5zM14 3.5V7.5h4M9 12h6M9 15h6M9 18h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lbl">חוברות</span></button>
      <button class="icon-btn topbar-btn" id="btnHal" title="מידע הלכתי ומקורות" aria-label="מידע הלכתי"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5C10 5 7.5 4.5 4 4.5V18c3.5 0 6 .5 8 2 2-1.5 4.5-2 8-2V4.5c-3.5 0-6 .5-8 2zM12 6.5V20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lbl">הלכות</span></button>
      <button class="icon-btn topbar-btn" id="btnInfo" title="אודות ומקור הנתונים" aria-label="אודות"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 11v5.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="7.8" r="1" fill="currentColor"/></svg><span class="lbl">אודות</span></button>
    </div>
  </header>

  <div class="notice" id="notice" role="note">
    <span class="notice-dot"></span>
    <span>המפות להתמצאות בלבד. עירוב יכול להיפסל בכל שבוע, ולכן לפני שבת יש לוודא מול האחראי המקומי.</span>
    <button class="notice-call" data-phone="054-8483320">מוקד העירוב · 054-8483320</button>
  </div>

  <div class="layout">
    <nav class="rail" id="rail" aria-label="ערים">
      <div class="secnav" role="tablist" aria-label="ניווט ראשי">
        <button class="sec" data-sec="il" role="tab">ישראל</button><button class="sec" data-sec="abroad" role="tab">חו"ל</button><button class="sec" data-sec="hosp" role="tab">בתי חולים</button>
      </div>
      <div class="rail-head">
        <span id="railTitle">ערים</span><span class="count" id="cityCount"></span>
      </div>
      <div class="rail-list" id="cityList"></div>
    </nav>
    <div class="main-col">
      <div class="viewbar"><div class="viewtabs" id="viewTabs" role="tablist" aria-label="תצוגה"><button class="sec on" data-tab="list" role="tab">רשימה</button><button class="sec" data-tab="map" role="tab">מפה</button></div><span class="viewscope" id="viewScope"></span></div>
      <main class="app-content" id="main" tabindex="-1"></main>
      <section class="map-tab" id="mapTab" aria-label="מפה" hidden></section>
    </div>
  </div>
</div>

<!-- מציג מפה -->
<div class="viewer" id="viewer" hidden>
  <div class="viewer-bar">
    <button class="icon-btn" id="vClose" title="סגירה (Esc)" aria-label="סגירה"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <div class="viewer-titles"><strong id="vTitle"></strong><span id="vSub"></span></div>
    <div class="viewer-tools">
      <span class="pager" id="vPager" hidden>
        <button class="icon-btn" id="vPrev" title="העמוד הקודם (PageUp)" aria-label="העמוד הקודם"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <label class="page-val"><input id="vPage" type="number" min="1" aria-label="מספר עמוד"><span id="vPages"></span></label>
        <button class="icon-btn" id="vNext" title="העמוד הבא (PageDown)" aria-label="העמוד הבא"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </span>
      <button class="icon-btn" id="vOut" title="הקטנה (-)" aria-label="הקטנה"><svg viewBox="0 0 24 24"><path d="M6 12h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <span class="zoom-val" id="vZoom">100%</span>
      <button class="icon-btn" id="vIn" title="הגדלה (+)" aria-label="הגדלה"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <button class="icon-btn" id="vFit" title="התאמה למסך (0)" aria-label="התאמה למסך"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <button class="icon-btn" id="vRot" title="סיבוב (R)" aria-label="סיבוב"><svg viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.05-4.95M19 4v4h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <span class="exp-wrap">
        <button class="icon-btn" id="vExp" title="ייצוא: תמונה או הדפסה" aria-label="ייצוא" aria-haspopup="menu"><svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="menu" id="expMenu" role="menu" hidden>
          <button role="menuitem" data-exp="png">שמירה כתמונה PNG</button>
          <button role="menuitem" data-exp="jpg">שמירה כתמונה JPG</button>
          <button role="menuitem" data-exp="print">הדפסה / שמירה כ-PDF</button>
          <button role="menuitem" data-exp="book-pdf" class="doc-only">החוברת כולה — PDF</button>
          <button role="menuitem" data-exp="book-zip" class="doc-only">החוברת כולה — ZIP (תמונות)</button>
          <button role="menuitem" data-exp="part-pdf" class="part-only">החלק הזה בלבד — PDF</button>
        </div>
      </span>
      <button class="icon-btn" id="vSide" title="אחראים במפה זו" aria-label="אחראים"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM14 5v14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button>
    </div>
  </div>
  <div class="viewer-body">
    <div class="stage" id="stage"><img id="vImg" alt="" draggable="false"></div>
    <aside class="viewer-side" id="vSidePanel"></aside>
  </div>
  <div class="viewer-hint" id="vHint">גלגלת או צביטה להגדלה · גרירה להזזה · לחיצה כפולה להגדלה מהירה</div>
</div>

<div class="sheet-scrim" id="infoScrim" hidden>
  <div class="sheet" role="dialog" aria-labelledby="infoTitle">
    <h2 id="infoTitle">אודות גבולות עירוב</h2>
    <div id="infoBody"></div>
    <div class="sheet-actions"><button class="btn tonal" id="infoClose">סגירה</button></div>
  </div>
</div>
<div class="print-sheet" id="printSheet" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="pdfjs/pdf.min.js"></script>
<script src="data.js"></script>
<script src="eruv-lines.js"></script>
<script src="docs.js"></script>
<script src="extra.js"></script>
<script src="bridge.js"></script>
<script src="map-core.js"></script>
<script src="world-basemap.js"></script>
<script src="streets-cities.js"></script>
<script src="map-ui.js"></script>
<script src="shared/report/crash-report.js"></script>
<script src="shared/promo/achat-promo.js"></script>
<script src="app.js"></script>
<script src="i18n.js"></script>
</body>
</html>
